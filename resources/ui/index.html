<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Inbox · 桌面待办</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/markdown-it.min.js" defer></script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main class="panel" aria-label="Obsidian 任务收件箱">
    <header class="titlebar" title="拖动标题移动待办">
      <div class="heading"><h1 lang="en">Inbox</h1><span id="count" class="count" aria-label="未完成任务数">—</span></div>
      <div class="header-actions"><button id="open-note" class="icon-button" type="button" title="在 Obsidian 中打开收件箱" aria-label="在 Obsidian 中打开收件箱">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg>
      </button><button id="menu" class="icon-button" type="button" title="窗口选项" aria-label="窗口选项"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
    </header>
    <div class="scroll-area">
      <ul id="tasks" aria-label="未完成任务"></ul>
      <div id="empty" class="empty" hidden><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15"/><path d="m12 20 5 5 11-11"/></svg><p>都处理好了</p><span>新任务会自动出现在这里</span></div>
      <p id="loading" class="loading">正在读取收件箱…</p>
    </div>
    <footer>
      <div class="status-line"><span id="status" lang="en" role="status" aria-live="polite">Connecting to note…</span><button id="refresh" type="button" class="icon-button" title="刷新任务" aria-label="刷新任务"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9a7.5 7.5 0 1 0 .1 5M19 4v5h-5"/></svg></button></div>
      <div id="notice" role="status" aria-live="polite" hidden><span id="notice-text"></span><button id="undo" type="button" hidden>撤销</button></div>
    </footer>
  </main>
</body>
</html>
